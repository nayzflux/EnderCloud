name: endercloud

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - endercloud

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - endercloud

  orchestrator:
    build:
      context: ./orchestrator
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./groups:/data/groups:ro
      - ./templates:/data/templates:ro
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:8080/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - endercloud

  agent:
    build:
      context: ./orchestrator
    command: ["bun", "src/agent/index.ts"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime:/data/runtime
      - agent-template-cache:/data/template-cache
    expose:
      - "8090"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:8090/health/live');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - endercloud

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:3000');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - endercloud

volumes:
  postgres-data:
  agent-template-cache:

networks:
  endercloud:
    name: endercloud
