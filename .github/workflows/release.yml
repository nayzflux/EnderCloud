name: Release validation
on:
  pull_request:
  push:
    branches: [main, master, "codex/release-refactor"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - name: Install Chromium system libraries
        working-directory: apps/dashboard
        run: bunx --no-install playwright install-deps chromium
      - name: Validate all applications, protocol, deployment and Docker recovery
        run: bun run check:release
        env:
          CI: "true"
          REAL_DOCKER: /usr/bin/docker
          NEXT_TELEMETRY_DISABLED: "1"
