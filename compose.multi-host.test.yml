name: endercloud

services:
  agent-secondary:
    build:
      context: ./orchestrator
    command: ["bun", "src/agent/index.ts"]
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    environment:
      AGENT_ID: secondary-host
      AGENT_VERSION: ${AGENT_VERSION:-0.1.0}
      AGENT_LISTEN_PORT: 8090
      AGENT_ADVERTISED_CONTROL_URL: http://agent-secondary:8090
      AGENT_ADVERTISED_GAME_ADDRESS: ${SECONDARY_AGENT_GAME_ADDRESS:?Set the secondary private game address}
      AGENT_ALLOCATABLE_CPU: ${SECONDARY_AGENT_CPU:-4}
      AGENT_ALLOCATABLE_MEMORY_BYTES: ${SECONDARY_AGENT_MEMORY_BYTES:-8589934592}
      AGENT_HEARTBEAT_INTERVAL: 5s
      AGENT_GAME_PORT_START: 25665
      AGENT_GAME_PORT_END: 25764
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
      ORCHESTRATOR_URL: http://orchestrator:8080
      AGENT_DOCKER_SOCKET: /var/run/docker.sock
      AGENT_DOCKER_NETWORK: endercloud
      AGENT_RUNTIME_DIRECTORY: /data/runtime
      AGENT_RUNTIME_HOST_DIRECTORY: ${SECONDARY_RUNTIME_HOST_ROOT:?Set the secondary absolute runtime path}
      AGENT_TEMPLATE_CACHE_DIRECTORY: /data/template-cache
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime-secondary:/data/runtime
      - secondary-agent-template-cache:/data/template-cache
    expose:
      - "8090"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:8090/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - endercloud

volumes:
  secondary-agent-template-cache:
